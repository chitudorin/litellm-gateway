## LiteLLM gateway config: one alias ("deepseek-flash") backed by several free providers.
## Client (Codex) asks for `deepseek-flash`; the router walks `order` 1 -> 3 and fails over.
## Provider keys come from the environment; nothing secret lives in this file.

model_list:
  # ---- deepseek-flash: one alias, strict priority via `order` (lowest first) ----
  - model_name: deepseek-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash:free   # from GET /v1/models
      api_base: https://tokenharbor.ai/v1
      api_key: os.environ/TOKENHARBOR_API_KEY
      order: 1
      # Codex speaks only the Responses API. Without this flag LiteLLM forwards
      # /v1/responses to {api_base}/responses, which these providers don't implement.
      # The flag bridges /v1/responses -> the provider's /v1/chat/completions.
      use_chat_completions_api: true
    model_info:
      id: tokenharbor

  - model_name: deepseek-flash
    litellm_params:
      model: openai/free/deepseek-v4.1-flash
      api_base: https://api.apinex.bond/v1
      api_key: os.environ/APINEX_API_KEY
      order: 2
      use_chat_completions_api: true
    model_info:
      id: apinex

  # Beam: last resort inside the same alias
  - model_name: deepseek-flash
    litellm_params:
      model: openai/Beam-1.0-501B-A23B
      api_base: https://api.reflection.ai/openai/v1
      api_key: os.environ/REFLECTION_API_KEY
      order: 3
      use_chat_completions_api: true
    model_info:
      id: reflection-fallback

litellm_settings:
  drop_params: true          # silently drop params a provider doesn't support (Codex sends several)
  request_timeout: 600       # long agent turns / reasoning

router_settings:
  enable_pre_call_checks: true   # drop deployments the request can't fit (context window, region, params)
  routing_strategy: simple-shuffle
  num_retries: 3             # retries within one order tier before escalating to the next tier
  timeout: 600
  allowed_fails: 1           # failures per minute before a deployment is cooled down
  cooldown_time: 300         # seconds a failing provider is skipped before it is tried again
